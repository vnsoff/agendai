name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: agendai_test
          POSTGRES_USER: agendai
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendai"
          --health-interval 3s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: agendai
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable btree_gist
        run: psql "postgresql://agendai:secret@127.0.0.1:5432/agendai_test" -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI Checks
        run: composer ci:check

  # Production deploy: only from main, only after the checks above pass.
  # The build runs here (not on Vercel) because Wayfinder needs PHP to generate the typed routes.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Identifiers, not credentials: only VERCEL_TOKEN grants access.
      VERCEL_ORG_ID: team_Ac2ftDHTDjbmKXaM6UHIltis
      VERCEL_PROJECT_ID: prj_MtAETLUWOb2XNB7ehsuux66ADhOr

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Run migrations on Neon
        run: |
          set -a; . .vercel/.env.production.local; set +a
          DB_URL="$DATABASE_URL_UNPOOLED" php artisan migrate --force

      - name: Build and deploy
        id: deploy
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          echo "url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
